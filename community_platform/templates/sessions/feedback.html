{% extends "base.html" %}
{% load static %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: 'Segoe UI', sans-serif;
    }

    .feedback-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 30px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        color: white;
        animation: fadeIn 0.6s ease-in-out;
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    h3 {
        text-align: center;
        font-weight: 400;
        margin-bottom: 25px;
        color: #ddd;
    }

    label {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        opacity: 0.9;
    }

    input, textarea, select {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 14px;
    }

    textarea {
        resize: none;
        height: 100px;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #ff7e5f, #feb47b);
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="feedback-container">

    <h2> Leave Feedback</h2>
    <h3>{{ session.title }}</h3>

    <form method="post">
        {% csrf_token %}

        <label>Rating (1–5)</label>
        {{ form.rating }}

        <label>Comment</label>
        {{ form.comment }}

        <button type="submit">Submit Feedback 🚀</button>
    </form>

</div>

{% endblock %}
